name: Test Yahodyn Bot

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        
      - name: Restore queue state
        uses: actions/cache@v4
        with:
          path: queue_state.json
          key: yahodyn-queue-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            yahodyn-queue-
      - name: Send Yahodyn queue to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
