name: Test Yahodyn Bot

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "2-59/5 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Inspect Yahodyn queue
      - name: Send Yahodyn queue to Telegram
        run: python main.py
